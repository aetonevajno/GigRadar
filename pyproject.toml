[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gigradar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.21,<1",
]

[tool.setuptools]
packages = ["app", "bot", "locales"]

[tool.setuptools.package-data]
locales = ["*.json"]

apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: GigRadar PostgreSQL
    uid: gigradar-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: gigradar_monitor
    database: gigradar
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_MONITOR_PASSWORD}

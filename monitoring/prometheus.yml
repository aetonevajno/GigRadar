global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:9000']
  - job_name: bot
    static_configs:
      - targets: ['bot:9000']
  - job_name: collector
    static_configs:
      - targets: ['collector:9000']
  - job_name: notifier
    static_configs:
      - targets: ['notifier:9000']
  - job_name: db-monitor
    static_configs:
      - targets: ['db-monitor:9100']

name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gigradar-production
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gigradar_test
          POSTGRES_USER: gigradar
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gigradar -d gigradar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PYTHONPATH: .:research
      TEST_DATABASE_URL: postgresql://gigradar:test-password@127.0.0.1:5432/gigradar_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt -r bot/requirements.txt -r research/requirements.txt ruff==0.16.10
      - name: Check Python style
        run: |
          ruff check app bot research monitoring
          ruff format --check app bot research monitoring
      - name: Check deployment scripts
        run: bash -n deploy/update.sh deploy/backup.sh
      - name: Test API and bot
        run: python -m unittest discover -s app/tests
      - name: Test collector and notifications
        run: python -m unittest discover -s research/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build website
        run: npm ci && npm run build
        working-directory: web

  deploy:
    needs: [python, web]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - name: Update VPS
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Set DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS secret}"
          : "${APP_DOMAIN:?Set APP_DOMAIN variable}"
          install -m 700 -d "$HOME/.ssh"
          key_file=$(mktemp "$HOME/.ssh/gigradar-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$key_file" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd gigradar && bash deploy/update.sh $GITHUB_SHA"
      - name: Check public API
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --output /dev/null "https://$APP_DOMAIN/api/health"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gigradar
      POSTGRES_USER: gigradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gigradar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigradar -d gigradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build:
      context: ./research
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gigradar@postgres:5432/gigradar
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TIMEPAD_API_TOKEN: ${TIMEPAD_API_TOKEN:?Set TIMEPAD_API_TOKEN in .env}

volumes:
  gigradar-postgres:
